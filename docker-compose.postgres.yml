services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-misp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-test-only}
      POSTGRES_DB: ${POSTGRES_DATABASE:-misp}
    command: postgres
    cap_add: []
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 30

  misp-core:
    image: ${MISP_CORE_IMAGE:-misp-core-postgres:v2.5.47}
    environment: &postgres-environment
      DB_ENGINE: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-misp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-test-only}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-misp}
      POSTGRES_SCHEMA: public
      POSTGRES_SSLMODE: disable
      BASE_URL: https://localhost
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redispassword}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@admin.test}
      NUM_WORKERS_DEFAULT: "1"
      NUM_WORKERS_PRIO: "1"
      NUM_WORKERS_EMAIL: "1"
      NUM_WORKERS_UPDATE: "1"
      NUM_WORKERS_CACHE: "1"
    volumes: &misp-volumes
      - misp_config:/var/www/MISP/app/Config
      - misp_files:/var/www/MISP/app/files
      - misp_gnupg:/var/www/MISP/.gnupg
      - misp_logs:/var/www/MISP/app/tmp/logs

  misp-bootstrap:
    image: ${MISP_CORE_IMAGE:-misp-core-postgres:v2.5.47}
    profiles: ["bootstrap"]
    environment:
      <<: *postgres-environment
      MISP_CONTAINER_MODE: bootstrap
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes: *misp-volumes

volumes:
  postgres_data:
  misp_config:
  misp_files:
  misp_gnupg:
  misp_logs: